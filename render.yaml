services:
  - type: web
    name: raptor-dynamics-admin
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/public/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_ROOT
        value: /tmp/raptor-data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
